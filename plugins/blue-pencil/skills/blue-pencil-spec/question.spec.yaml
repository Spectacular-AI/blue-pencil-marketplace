# A good question to the user: three short sections under H4 headings. Each heading starts with its
# section's name and may add its own words after a colon ("#### Where we are: your one-pager so far");
# a heading in other words entirely is not found (.06 to .41). Write each question toward it; review the
# session's first two against it before sending them, and a later one when unsure (Drew, 2026-09-29).
title: A question to the user
description: >-
  One message an agent sends a user while working out with them what they want. It says where the work
  stands and what the agent took from the user's last answer, what raised the question, then asks one
  question the user can answer from what they know, knowing what the answer will change.
packages:
  tone_and_language: {option: professional}
  banned_words: {option: default}
  writing_structure:
    option: default
    # The message opens with where the work stands, by design, so its main point is not its first sentence.
    items: {main-point-first: "off"}
asserts:
  must_not_use:
    - 'a score or probability written as a number, such as "0.46" or "(0.35)"'
    - '"spec", "assertion", "package", "cascade" or "part path" as the names of the tool''s own things, or a rule kind written as code, such as "must_say"'
  must_not_say:
    - 'a second question the user must also answer, separate from the first; one question offering two answers to choose between is a single question'
  should:
    - {text: "reads as one colleague writing to another: the agent writes as 'I' or 'we' to the user as 'you'", cascade: false}
    # Length is not checked (SPEC.md, "Known limits"); what can be checked is that nothing is said twice.
    - {text: 'says each point once: no sentence repeats what an earlier sentence or section already said', cascade: false}
children:
  where-we-are:
    type: section
    name: Where we are
    description: where the work stands, and what the agent took from the user's last answer
    present: required
    comes: {before: what-i-noticed}
    asserts:
      must_say:
        - "the goal of the work, as the agent understands it, in the agent's own words"
        - 'how far the work has got: what the agent and the user have settled so far'
        - "what the agent took from the user's last message, restated in the agent's own words"
  what-i-noticed:
    type: section
    name: What I noticed
    description: what the agent noticed in the document or the conversation that raised the question
    present: required
    comes: {before: question}
    asserts:
      must_say:
        - 'what the agent noticed that raised the question, such as a passage in the document, something missing from it, or something the user said'
        - 'something concrete for the user to react to: words quoted from their document in quotation marks, a small made-up example, or two versions side by side'
  question:
    type: section
    name: My question
    description: the one question the user is asked to answer, and what each answer will change
    present: required
    asserts:
      must_say:
        - 'a question for the user to answer'
        - 'what the answer will change: what the agent will do or write differently depending on the answer'
      should:
        - 'asks something the user can answer in a sentence from what they know about their document and its readers, without learning how the tool works'
